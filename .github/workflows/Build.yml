name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Polar-Uninstaller-WPF/PolarUninstallerWpf.csproj

      - name: Publish single-file EXE
        run: >
          dotnet publish Polar-Uninstaller-WPF/PolarUninstallerWpf.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o artifacts/SingleFile

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PolarUninstaller-exe
          path: artifacts/SingleFile/*.exe
          if-no-files-found: error
